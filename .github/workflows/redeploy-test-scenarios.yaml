name: "Redeploy Test Scenarios"
run-name: "Redeploy test scenarios to test cluster"

# Weekly refresh of the blackbox test scenarios on the test cluster.
# Undeploys all existing scenarios and deploys them back from scratch.
on:
  schedule:
    # Every Monday at 00:00 UTC (Monday midnight).
    - cron: "0 0 * * 1"
  # Allow manual triggering from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping runs (e.g. scheduled run and a manual trigger at the same time)
# from corrupting the cluster state while scenarios are being (un)deployed.
concurrency:
  group: redeploy-test-scenarios
  cancel-in-progress: false

jobs:
  redeploy-test-scenarios:
    name: Undeploy and redeploy all test scenarios
    runs-on: ubuntu-latest
    environment: e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # kubectl is pre-installed on ubuntu-latest runners, so no explicit install step is needed.

      - name: Configure cluster access
        env:
          TEST_CLUSTER_KUBECONFIG: ${{ secrets.TEST_CLUSTER_KUBECONFIG }}
        run: |
          if [ -z "$TEST_CLUSTER_KUBECONFIG" ]; then
            echo "::error::Secret TEST_CLUSTER_KUBECONFIG is not set."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$TEST_CLUSTER_KUBECONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Undeploy all test scenarios
        run: |
          chmod +x ./scripts/shell/undeploy_test_scenarios.sh
          ./scripts/shell/undeploy_test_scenarios.sh

      - name: Deploy all test scenarios
        run: |
          chmod +x ./scripts/shell/deploy_test_scenarios.sh
          ./scripts/shell/deploy_test_scenarios.sh

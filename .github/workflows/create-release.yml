name: "Create release"
run-name: Create release ${{ inputs.name }}

# Required repository secrets:
# - GITHUB_TOKEN
# - AIFORCE_APP_PRIVATE_KEY  # private key (PEM) of the GitHub App used for release automation
# Required repository variables:
# - AIFORCE_APP_ID           # app id of the GitHub App used for release automation
# - COMPANION_IMAGE_NAME
# - IMAGE_NAME_INDEXER
#
# NOTE: Release automation authenticates via a GitHub App (short-lived installation token)
#       instead of a technical user's personal access token. The App requires the
#       "contents: write" and "pull requests: write" repository permissions.

# This workflow creates a release for kyma-companion.
# The steps are:
# 1. Get release tag as user input.
# 2. Validate the release tag if its formated like x.y.z.
# 3. Check if the release branch `release-x.y` already exists. If not, fail the workflow.
# 4. Check if release tag already exists. If yes, fail the workflow.
# 5. Run unit tests and integration tests from the release branch.
# 6. Create a git tag from the release branch.
# 7. Build a container image against the git tag and push it to registry.
# 8. Create a draft release against the git tag.
# 9. Check if all the pre-requisites are met for publishing the release.
# NOTE: The draft release needs to be manually reviewed and published.

on:
  workflow_dispatch:
    inputs:
      name: # release tag
        description: "Release tag (i.e. x.y.z). Make sure that branch with name release-x.y exists."
        default: ""
        required: true

permissions: write-all

# global env variables.
env:
  REPOSITORY_FULL_NAME: "${{ github.repository }}" # <owner>/<repository-name>.
  RELEASE_TAG: "${{ inputs.name }}"
  PYTHON_VERSION: "3.14"

jobs:
  validate-input-params:
    name: Validate input parameters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # fetch all the branches and tags.
          ref: "main"

      - name: Check if that release tag is valid
        id: check-release-tag
        run: |
          ./scripts/shell/check_release_tag.sh "${RELEASE_TAG}"

      - name: Check if release tag already exists
        run: |
          if [ "$(git tag -l "${RELEASE_TAG}")" ]; then
            echo "Warning: Release tag ${RELEASE_TAG} already exists"
          fi

      - name: Export release branch name as action output
        id: export-branch-name
        run: |
          MAJOR=$(echo "$RELEASE_TAG" | cut -d. -f1)
          MINOR=$(echo "$RELEASE_TAG" | cut -d. -f2)
          export RELEASE_BRANCH="release-$MAJOR.$MINOR"
          echo "exporting branch name: $RELEASE_BRANCH"
          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
    outputs:
      release_branch: ${{ steps.export-branch-name.outputs.release_branch }}

  run-unit-tests:
    ## **IMPORTANT**: If any changes are made to how to run the unit tests
    ## in the release-workflow, make sure to update the steps
    ## in the unit-test.yaml workflow as well.
    name: Run unit tests
    needs: validate-input-params
    runs-on: ubuntu-latest
    # The job checks out and executes code from the release branch in the
    # context of the default branch. Gate it behind the same protected
    # environment as the integration-test jobs so the checkout is approved
    # by a reviewer before any release-branch code runs (CodeQL: cache poisoning).
    environment: e2e
    permissions: read-all
    env:
      RELEASE_BRANCH: ${{ needs.validate-input-params.outputs.release_branch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with: # checkout the release branch.
          ref: ${{ needs.validate-input-params.outputs.release_branch }}

      - name: Check if the checked out branch is the release branch.
        run: |
          git branch --show-current
          git branch --show-current | grep -q "${RELEASE_BRANCH}"

      - name: Extract Python version
        id: python-version
        run: ./scripts/shell/extract-python-version.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: poetry install --with dev

      - name: Create config.json
        run: |
          mkdir -p config
          echo '{"mock-key": "mock-value"}' > config/config.json

      - name: Run tests
        run: poetry run poe test

  run-unit-tests-indexer:
    ## **IMPORTANT**: If any changes are made to how to run the unit tests
    ## in the release-workflow, make sure to update the steps
    ## in the unit-test.yaml workflow as well.
    name: Run indexer unit tests
    needs: validate-input-params
    runs-on: ubuntu-latest
    # See "Run unit tests" above.
    environment: e2e
    permissions: read-all
    env:
      RELEASE_BRANCH: ${{ needs.validate-input-params.outputs.release_branch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with: # checkout the release branch.
          ref: ${{ needs.validate-input-params.outputs.release_branch }}

      - name: Check if the checked out branch is the release branch.
        run: |
          git branch --show-current
          git branch --show-current | grep -q "${RELEASE_BRANCH}"

      - name: Extract Python version
        id: python-version
        run: ./scripts/shell/extract-python-version.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: ./doc_indexer
        run: poetry install --with test

      - name: Create config.json
        run: |
          mkdir -p config
          echo '{"mock-key": "mock-value"}' > config/config.json

      - name: Run tests
        working-directory: ./doc_indexer
        env:
          LOG_LEVEL: "DEBUG"
          # Kyma docs path.
          DOCS_SOURCES_FILE_PATH: "./docs_sources.json"
          DOCS_PATH: "/test-data"
          DOCS_TABLE_NAME: "kc_pr_release_${{ inputs.name }}"
        run: poetry run poe test-unit

  run-integration-tests:
    ## **IMPORTANT**: If any changes are made to how to run the integration tests
    ## in the release-workflow, make sure to update
    ## in the run-integration-test.yaml workflow as well.
    name: Run integration tests
    needs: validate-input-params
    runs-on: ubuntu-latest
    environment: e2e
    permissions: read-all
    env:
      RELEASE_BRANCH: ${{ needs.validate-input-params.outputs.release_branch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with: # checkout the release branch.
          ref: ${{ needs.validate-input-params.outputs.release_branch }}

      - name: Check if the checked out branch is the release branch.
        run: |
          git branch --show-current
          git branch --show-current | grep -q "${RELEASE_BRANCH}"

      - name: Extract Python version
        id: python-version
        run: ./scripts/shell/extract-python-version.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run integration tests
        env:
          LOG_LEVEL: "DEBUG"
          COMPANION_TESTS_DEFAULT_CONFIG: ${{ secrets.COMPANION_TESTS_DEFAULT_CONFIG }}
          INTEGRATION_TEST_CONFIG: ${{ secrets.INTEGRATION_TEST_CONFIG }}
        run: |
          echo "$COMPANION_TESTS_DEFAULT_CONFIG" \
            | jq --argjson override "${INTEGRATION_TEST_CONFIG:-"{}"}" '. * $override' > "$GITHUB_WORKSPACE/config/config.json"
          poetry run poe test-integration

  run-integration-tests-indexer:
    ## **IMPORTANT**: If any changes are made to how to run the integration tests
    ## in the release-workflow, make sure to update
    ## in the run-integration-test.yaml workflow as well.
    name: Run indexer integration tests
    needs: validate-input-params
    runs-on: ubuntu-latest
    environment: e2e
    permissions: read-all
    env:
      RELEASE_BRANCH: ${{ needs.validate-input-params.outputs.release_branch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with: # checkout the release branch.
          ref: ${{ needs.validate-input-params.outputs.release_branch }}

      - name: Check if the checked out branch is the release branch.
        run: |
          git branch --show-current
          git branch --show-current | grep -q "${RELEASE_BRANCH}"

      - name: Extract Python version
        id: python-version
        run: ./scripts/shell/extract-python-version.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: ./doc_indexer
        run: poetry install --with test

      - name: Run integration tests
        working-directory: ./doc_indexer
        env:
          LOG_LEVEL: "DEBUG"
          # Kyma docs path.
          DOCS_SOURCES_FILE_PATH: "./docs_sources.json"
          DOCS_PATH: "/test-data"
          DOCS_TABLE_NAME: "kc_pr_release_${{ inputs.name }}"
          DOC_INDEXER_TESTS_CONFIG: ${{ secrets.DOC_INDEXER_TESTS_CONFIG }}
        run: |
          export CONFIG_PATH=$GITHUB_WORKSPACE/config/config.json
          echo "$DOC_INDEXER_TESTS_CONFIG" > "$CONFIG_PATH"
          poetry run poe test-integration

  get-image-sha:
    name: Get Release branch head commit SHA
    runs-on: ubuntu-latest
    needs: validate-input-params
    env:
      RELEASE_BRANCH: ${{ needs.validate-input-params.outputs.release_branch }}
    outputs:
      sha: ${{ steps.get_sha.outputs.sha }}
    steps:
      - name: Checkout target branch from another repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPOSITORY_FULL_NAME }}
          ref: ${{ env.RELEASE_BRANCH }}

      - name: Get the last commit's SHA of the release branch
        id: get_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  run-evaluation-tests:
    name: Run evaluation tests
    uses: kyma-project/kyma-companion/.github/workflows/evaluation-test-reusable.yaml@main
    needs: get-image-sha
    secrets: inherit
    with:
      IMAGE_NAME: ${{ vars.COMPANION_IMAGE_NAME }}:${{ needs.get-image-sha.outputs.sha }}
      TEST_REPO_FULLNAME: ${{ github.repository }}
      TEST_REF: ${{ needs.get-image-sha.outputs.sha }}

  run-e2e-tests-indexer-prerelease:
    name: Run indexer e2e tests (pre-release)
    uses: kyma-project/kyma-companion/.github/workflows/e2e-tests-doc-indexer-reusable.yaml@main
    needs: get-image-sha
    secrets: inherit
    with:
      IMAGE_NAME: "${{ vars.IMAGE_NAME_INDEXER }}:${{ needs.get-image-sha.outputs.sha }}"
      DOCS_TABLE_NAME: "kc_release_${{ inputs.name }}_e2e_pre"
      CHECKOUT_REF: ${{ needs.get-image-sha.outputs.sha }}

  create-git-tag:
    name: Create git tag for release
    needs:
      [
        validate-input-params,
        run-unit-tests,
        run-integration-tests,
        run-evaluation-tests,
        run-e2e-tests-indexer-prerelease,
        run-integration-tests-indexer,
        run-unit-tests-indexer,
      ]
    runs-on: ubuntu-latest
    environment: e2e
    env:
      RELEASE_BRANCH: ${{ needs.validate-input-params.outputs.release_branch }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AIFORCE_APP_ID }}
          private-key: ${{ secrets.AIFORCE_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with: # checkout the release branch. This is the branch where the release tag will be created.
          fetch-depth: 0 # fetch all the branches and tags.
          ref: ${{ needs.validate-input-params.outputs.release_branch }}
          token: ${{ steps.app-token.outputs.token }} # cloning repo using GitHub App token so the tag push triggers the build workflow (GITHUB_TOKEN would not: https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow).

      - name: Check if the checked out branch is the release branch.
        run: |
          git branch --show-current
          git branch --show-current | grep -q "${RELEASE_BRANCH}"

      - name: Create git tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # creating git tag using GitHub App token so it triggers the build workflow.
        run: |
          ./scripts/shell/create_git_tag.sh "${RELEASE_TAG}"

  wait-for-build:
    name: Wait for image build job
    needs: [validate-input-params, create-git-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with: # release scripts are used from main branch.
          ref: main

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install requirements
        run: |
          pip install -r ./scripts/python/wait-for-commit-check/requirements.txt

      - name: wait for build companion
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_REF: ${{ inputs.name }}
          # The re-useable image-builder workflow from neighbors appends the "Build image" suffix to the check run name.
          GIT_CHECK_RUN_NAME: "build-${{ inputs.name }} / Build image"
          INTERVAL: 60
          TIMEOUT: 900
        run: |
          python ./scripts/python/wait-for-commit-check/run.py
      - name: wait for build indexer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_REF: ${{ inputs.name }}
          # The re-useable image-builder workflow from neighbors appends the "Build image" suffix to the check run name.
          GIT_CHECK_RUN_NAME: "build-indexer-${{ inputs.name }} / Build image"
          INTERVAL: 60
          TIMEOUT: 900
        run: |
          python ./scripts/python/wait-for-commit-check/run.py

  run-e2e-tests-indexer:
    name: Run indexer e2e tests
    uses: kyma-project/kyma-companion/.github/workflows/e2e-tests-doc-indexer-reusable.yaml@main
    needs: wait-for-build
    secrets: inherit
    with:
      IMAGE_NAME: "${{ vars.IMAGE_NAME_INDEXER }}:${{ inputs.name }}"
      DOCS_TABLE_NAME: "kc_release_${{ inputs.name }}_e2e"

  create-draft:
    name: Create draft release
    needs: [wait-for-build, run-e2e-tests-indexer]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with: # draft release is linked to the release tag. So we run the release scripts from main branch.
          fetch-depth: 0 # fetch all the branches and tags.
          ref: main

      - name: Create draft release
        id: create-draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/shell/create_draft_release.sh
          RELEASE_ID=$(cat release_id.txt)
          echo "Release ID: $RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
    outputs:
      release_id: ${{ steps.create-draft.outputs.release_id }}

  check-prerequisites:
    name: Check release pre-requisites
    needs: [create-draft, wait-for-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Check pre-requisites before publishing release for Companion
        env:
          IMAGE_NAME: ${{ vars.COMPANION_IMAGE_NAME }}
        run: ./scripts/shell/check_publish_release_prerequisites.sh "${RELEASE_TAG}"

      - name: Check pre-requisites before publishing release for Indexer
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME_INDEXER }}
        run: ./scripts/shell/check_publish_release_prerequisites.sh "${RELEASE_TAG}"

  upload-release-log:
    name: Upload release log
    needs: ["check-prerequisites"]
    if: ${{ needs.check-prerequisites.result == 'success' }}
    uses: kyma-project/compliancy/.github/workflows/notify-release-report.yml@main
    secrets: inherit
    with:
      release_version: ${{ inputs.name }}

# DRAFT -- contract checks for kyma-docs-search once it has its own repo.
#   oasdiff:      fails the PR on a breaking change in api/openapi.yaml compared with the last release tag
#   schemathesis: boots the service against a pgvector container with a small seeded run and checks every
#                 response against the OpenAPI document (needs AI Core credentials for /v1/search; use the
#                 e2e secret, limit examples to keep embedding cost negligible)
name: Service contract checks

on:
  pull_request:
    paths: ["kyma-docs-search/**"]

permissions:
  contents: read

jobs:
  breaking-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Base spec from the last release tag
        run: |
          TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then echo "no release tag yet, comparing with main"; TAG=origin/main; fi
          git show "$TAG:kyma-docs-search/api/openapi.yaml" > /tmp/base.yaml
          echo "base=$TAG" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@v6
        with: { go-version-file: kyma-docs-search/go.mod }
      - name: oasdiff breaking
        run: go run github.com/oasdiff/oasdiff@latest breaking --fail-on ERR /tmp/base.yaml kyma-docs-search/api/openapi.yaml
      - name: oasdiff changelog to the job summary
        if: always()
        run: |
          { echo '```'; go run github.com/oasdiff/oasdiff@latest changelog /tmp/base.yaml kyma-docs-search/api/openapi.yaml || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  response-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: docs }
        ports: ["5433:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version-file: kyma-docs-search/go.mod }
      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }
      - name: Seed a small run (indexer, file -> pgvector import)
        working-directory: doc_indexer
        env:
          DOC_INDEXER_TESTS_CONFIG: ${{ secrets.DOC_INDEXER_TESTS_CONFIG }}
        run: |
          pip install poetry && poetry install --only main
          echo "$DOC_INDEXER_TESTS_CONFIG" > /tmp/config.json
          CONFIG_PATH=/tmp/config.json DOCS_SOURCES_FILE_PATH=./e2e_docs_sources.json DOCS_PATH=./data poetry run python src/main.py fetch
          CONFIG_PATH=/tmp/config.json DOCS_PATH=./data DOCS_WRITER=pgvector DOCS_SEARCH_PG_DSN=postgres://postgres:postgres@localhost:5433/docs poetry run python src/main.py index
      - name: Start the service
        working-directory: kyma-docs-search
        run: |
          CONFIG_PATH=/tmp/config.json DOCS_SEARCH_PG_DSN=postgres://postgres:postgres@localhost:5433/docs DOCS_SEARCH_PORT=8081 go run ./cmd/server &
          for _ in $(seq 1 30); do curl -sf localhost:8081/readyz && break; sleep 2; done
      - name: schemathesis
        run: |
          pip install schemathesis
          schemathesis run kyma-docs-search/api/openapi.yaml --url http://localhost:8081 \
            --include-path /v1/status --include-path /v1/search --max-examples 20 --checks all

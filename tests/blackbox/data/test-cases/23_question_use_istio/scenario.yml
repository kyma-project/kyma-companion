id: test-question-23
description: Unrelated to existing cluster resources, ask how to use isto.
queries:
- user_query: How can I use Istio in Kyma?
  resource:
    kind: Cluster
    api_version: ''
    name: ''
    namespace: ''
  expectations:
  - name: istio_is_included
    statement: points out that Istio comes preinstalled in Kyma
    threshold: 0.5
    required: true
  - name: busola_ui_navigation
    threshold: 0.5
    required: false
    statement: describes how to navigate in Kyma Dashboard (Busola) to find or manage
      Istio-related resources via the UI

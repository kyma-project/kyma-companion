id: test-question-23
description: Unrelated to existing cluster resources, ask how to use isto.
queries:
- user_query: How can I use Istio in Kyma?
  resource:
    kind: Cluster
    api_version: ''
    name: ''
    namespace: ''
  expectations:
  - name: istio_is_included
    statement: points out that Istio comes preinstalled in Kyma
    threshold: 0.5
    required: true
  - name: busola_ui_navigation
    threshold: 0.5
    required: false
    statement: describes how to view the Istio CR via the namespace-scoped Kyma →
      Istio section or manage Istio networking resources (VirtualServices, DestinationRules,
      Gateways) via the namespace-scoped Istio sidebar section in Kyma Dashboard,
      and does NOT direct the user to Cluster Details → Kyma → Istio or Configuration
      → Custom Resources for Istio resources

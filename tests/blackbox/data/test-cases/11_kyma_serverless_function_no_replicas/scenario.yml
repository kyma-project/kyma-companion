id: test-function-11
description: The Pod of the Serverless Function is not ready because the function
  is configured with 0 replicas.
queries:
- user_query: Why is the pod of the serverless Function not ready?
  resource:
    kind: Function
    api_version: serverless.kyma-project.io/v1alpha2
    name: func1
    namespace: test-function-11
  expectations:
  - name: function_error
    statement: points out that the Pod is not ready
    threshold: 0.5
    required: true
  - name: function_no_replicas
    statement: points out that the Function is configured with 0 replicas
    threshold: 0.5
    required: false
  - name: function_correct_replicas
    statement: provides the correct amount of replicas, which would be 1
    threshold: 0.5
    required: false
  - name: function_explanation
    statement: explains the use of Functions
    threshold: 0.5
    required: false
  - name: step_by_step_guide
    statement: provides a step-by-step guide on how to fix the issue
    threshold: 0.5
    required: false
  - name: partial_yaml
    statement: provides a partial yaml with the correct amount of replicas, which
      would be 1
    threshold: 0.5
    required: false
  - name: deployable_yaml
    statement: provides a complete yaml for the Function, with the namespace set to
      'test-function-11' and the replicas set to 1
    threshold: 0.5
    required: false
  - name: busola_ui_navigation
    threshold: 0.5
    required: false
    statement: describes how to navigate in Kyma Dashboard (Busola) to Workloads →
      Functions to adjust the replica count via the UI
